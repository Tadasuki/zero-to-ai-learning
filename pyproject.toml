[project]
name = "mlp-mnist-from-scratch"
version = "0.1.0"
description = "用 NumPy 从零实现一个能识别手写数字的多层感知机"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
]

[tool.uv]
package = false

# Cloudflare Pages 会在构建前执行 `pip install .`。本仓库是课程网站和
# 练习素材集合，不应把 site/ 或 starter/ 自动识别成 Python 包。
[tool.setuptools]
py-modules = []
